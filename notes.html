<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes</title>
  <style>
    :root {
      --sidebar-bg: #2d2e30;
      --tab-bg: #e8eaed;
      --tab-active: #ffffff;
      --text-main: #202124;
      --border-color: #dadce0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; background: #fff; }

    #sidebar {
      width: 180px;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 16px 12px;
      color: #fff;
      user-select: none;
      overflow-y: auto;
    }
    .sidebar-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #9aa0a6; margin-top: 10px; margin-bottom: 2px; }
    .tool-btn {
      background: #3c4043;
      border: 1px solid #5f6368;
      color: #e8eaed;
      padding: 7px 10px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
    }
    .tool-btn:hover { background: #5f6368; }
    .tool-btn.active-btn { background: #1a73e8; border-color: #1a73e8; }

    #main-container { flex: 1; display: flex; flex-direction: column; position: relative; }
    #top-bar {
      display: flex; align-items: flex-end; background: #f1f3f4;
      border-bottom: 1px solid var(--border-color); padding: 8px 12px 0 12px; gap: 4px; overflow-x: auto;
    }
    .tab {
      background: var(--tab-bg); padding: 8px 14px; border-radius: 6px 6px 0 0;
      font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px;
      border: 1px solid transparent; border-bottom: none;
    }
    .tab.active { background: var(--tab-active); border-color: var(--border-color); font-weight: 600; }
    .tab .close-tab { font-size: 14px; color: #70757a; cursor: pointer; }
    .tab .close-tab:hover { color: #d93025; }
    #add-tab-btn { background: transparent; border: none; font-size: 18px; cursor: pointer; padding: 4px 10px; color: #5f6368; }

    #sync-status {
      font-size: 11px;
      color: #888;
      margin-left: auto;
      align-self: center;
      padding-right: 12px;
    }

    #workspace { flex: 1; position: relative; overflow: hidden; background: #fafafa; }
    #editor {
      width: 100%; height: 100%; padding: 30px 40px; overflow-y: auto; outline: none;
      font-size: 15px; line-height: 1.6; color: var(--text-main); background: #fff;
    }
    #editor table { border-collapse: collapse; margin: 12px 0; width: 100%; }
    #editor td, #editor th { border: 1px solid #ccc; padding: 8px; min-width: 50px; }
    #editor img { max-width: 100%; border-radius: 4px; margin: 10px 0; }

    .sticky-note {
      position: absolute; width: 200px; height: 160px; background: #fff9c4;
      border: 1px solid #fbc02d; box-shadow: 2px 4px 10px rgba(0,0,0,0.15); border-radius: 4px;
      display: flex; flex-direction: column; z-index: 10;
    }
    .sticky-header {
      background: #fff59d; padding: 4px 6px; cursor: grab; display: flex;
      justify-content: space-between; align-items: center; font-size: 11px; font-weight: bold; color: #555;
    }
    .sticky-content { flex: 1; padding: 6px; outline: none; font-size: 13px; overflow-y: auto; }
    .sticky-close { cursor: pointer; font-weight: bold; color: #777; }
    .sticky-close:hover { color: #d93025; }
  </style>

  <!-- Google Identity Services & GAPI Client -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body>

  <div id="sidebar">
    <div class="sidebar-title">Google Drive Sync</div>
    <button id="auth-btn" class="tool-btn active-btn" onclick="handleAuthClick()">Sign In with Google</button>
    <button class="tool-btn" onclick="syncToDrive()">Sync Now</button>

    <div class="sidebar-title">Formatting</div>
    <button class="tool-btn" onclick="formatDoc('bold')"><b>Bold</b> (Ctrl+B)</button>
    <button class="tool-btn" onclick="formatDoc('italic')"><i>Italic</i> (Ctrl+I)</button>
    <button class="tool-btn" onclick="formatDoc('underline')"><u>Underline</u> (Ctrl+U)</button>
    <button class="tool-btn" onclick="formatDoc('formatBlock', '<h1>')">Heading 1</button>
    <button class="tool-btn" onclick="formatDoc('formatBlock', '<h2>')">Heading 2</button>
    <button class="tool-btn" onclick="formatDoc('formatBlock', '<p>')">Normal Text</button>

    <div class="sidebar-title">Insert</div>
    <button class="tool-btn" onclick="insertTable()">+ Table</button>
    <button class="tool-btn" onclick="document.getElementById('image-input').click()">+ Image</button>
    <input type="file" id="image-input" style="display: none" accept="image/*" onchange="insertImage(event)">
    <button class="tool-btn" onclick="createSticky()">+ Sticky Note</button>

    <div class="sidebar-title">Local Backup</div>
    <button class="tool-btn" onclick="exportData()">Export JSON</button>
    <button class="tool-btn" onclick="document.getElementById('import-input').click()">Import JSON</button>
    <input type="file" id="import-input" style="display: none" accept=".json" onchange="importData(event)">
  </div>

  <div id="main-container">
    <div id="top-bar">
      <div id="tabs-container" style="display: flex; gap: 4px;"></div>
      <button id="add-tab-btn" onclick="createGroup()" title="Add Group">+</button>
      <span id="sync-status">Local mode</span>
    </div>

    <div id="workspace">
      <div id="editor" contenteditable="true" spellcheck="true"></div>
      <div id="sticky-container"></div>
    </div>
  </div>

  <script>
    // --- GOOGLE DRIVE CONFIGURATION ---
    const CLIENT_ID = '157147659451-saa5f64vvgg33kkl41klse8jfq447rnr.apps.googleusercontent.com';
    const API_KEY = 'AIzaSyAzkt1L5EHyUNww-a_Ub9QneHruq9Ae1ZY';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';
    const SYNC_FILENAME = 'notes_app_sync.json';

    let tokenClient;
    let gapiInited = false;
    let gisInited = false;
    let driveFileId = null;
    let syncTimeout = null;

    // --- APPLICATION STATE ---
    let state = JSON.parse(localStorage.getItem('notes_app_data')) || {
      activeId: 1,
      groups: [{ id: 1, name: "General", content: "<p>Start writing here...</p>", stickies: [] }]
    };

    const editor = document.getElementById('editor');
    const tabsContainer = document.getElementById('tabs-container');
    const stickyContainer = document.getElementById('sticky-container');
    const syncStatus = document.getElementById('sync-status');
    const authBtn = document.getElementById('auth-btn');

    // --- GOOGLE API INITIALIZATION ---
    function gapiLoaded() {
      gapi.load('client', initializeGapiClient);
    }

    async function initializeGapiClient() {
      await gapi.client.init({
        apiKey: API_KEY,
        discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
      });
      gapiInited = true;
    }

    function gisLoaded() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: '', // defined at request time
      });
      gisInited = true;
    }

    window.addEventListener('load', () => {
      gapiLoaded();
      gisLoaded();
    });

    function handleAuthClick() {
      tokenClient.callback = async (resp) => {
        if (resp.error !== undefined) {
          throw (resp);
        }
        authBtn.innerText = "Signed In";
        authBtn.classList.remove('active-btn');
        syncStatus.innerText = "Connected to Drive";
        await loadFromDrive();
      };

      if (gapi.client.getToken() === null) {
        tokenClient.requestAccessToken({ prompt: 'consent' });
      } else {
        tokenClient.requestAccessToken({ prompt: '' });
      }
    }

    // Find or create sync file on Drive
    async function getOrCreateDriveFile() {
      const response = await gapi.client.drive.files.list({
        q: `name = '${SYNC_FILENAME}' and trashed = false`,
        fields: 'files(id, name)',
      });
      const files = response.result.files;
      if (files && files.length > 0) {
        driveFileId = files[0].id;
      } else {
        const createResp = await gapi.client.drive.files.create({
          resource: { name: SYNC_FILENAME, mimeType: 'application/json' },
          fields: 'id',
        });
        driveFileId = createResp.result.id;
      }
      return driveFileId;
    }

    // Load data from Google Drive
    async function loadFromDrive() {
      try {
        syncStatus.innerText = "Checking Drive...";
        const fileId = await getOrCreateDriveFile();
        const res = await gapi.client.drive.files.get({
          fileId: fileId,
          alt: 'media',
        });
        if (res.result && res.result.groups) {
          state = res.result;
          localStorage.setItem('notes_app_data', JSON.stringify(state));
          renderTabs();
          renderWorkspace();
          syncStatus.innerText = "Synced with Drive";
        } else {
          await syncToDrive();
        }
      } catch (err) {
        syncStatus.innerText = "Sync failed";
      }
    }

    // Upload data to Google Drive
    async function syncToDrive() {
      if (!gapi.client.getToken()) return;
      saveLocalState();
      syncStatus.innerText = "Syncing to Drive...";
      try {
        const fileId = await getOrCreateDriveFile();
        await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
          method: 'PATCH',
          headers: new Headers({
            'Authorization': `Bearer ${gapi.client.getToken().access_token}`,
            'Content-Type': 'application/json'
          }),
          body: JSON.stringify(state)
        });
        syncStatus.innerText = `Synced (${new Date().toLocaleTimeString()})`;
      } catch (e) {
        syncStatus.innerText = "Sync error";
      }
    }

    // --- CORE NOTE APP LOGIC ---
    function saveLocalState() {
      const current = state.groups.find(g => g.id === state.activeId);
      if (current) {
        current.content = editor.innerHTML;
        current.stickies = Array.from(document.querySelectorAll('.sticky-note')).map(el => ({
          x: parseInt(el.style.left) || 20,
          y: parseInt(el.style.top) || 20,
          text: el.querySelector('.sticky-content').innerHTML
        }));
      }
      localStorage.setItem('notes_app_data', JSON.stringify(state));
    }

    function scheduleSync() {
      saveLocalState();
      syncStatus.innerText = "Saving locally...";
      clearTimeout(syncTimeout);
      syncTimeout = setTimeout(() => {
        if (gapi.client.getToken()) syncToDrive();
      }, 2000);
    }

    function renderTabs() {
      tabsContainer.innerHTML = '';
      state.groups.forEach(g => {
        const tab = document.createElement('div');
        tab.className = `tab ${g.id === state.activeId ? 'active' : ''}`;
        tab.innerHTML = `
          <span>${g.name}</span>
          ${state.groups.length > 1 ? `<span class="close-tab" onclick="deleteGroup(event, ${g.id})">×</span>` : ''}
        `;
        tab.onclick = () => switchTab(g.id);
        tabsContainer.appendChild(tab);
      });
    }

    function renderWorkspace() {
      const current = state.groups.find(g => g.id === state.activeId);
      if (!current) return;
      editor.innerHTML = current.content || "";
      stickyContainer.innerHTML = "";
      (current.stickies || []).forEach(s => addStickyNode(s.x, s.y, s.text));
    }

    function switchTab(id) {
      saveLocalState();
      state.activeId = id;
      renderTabs();
      renderWorkspace();
    }

    function createGroup() {
      const name = prompt("Note group name:");
      if (!name) return;
      const newId = Date.now();
      state.groups.push({ id: newId, name: name.trim(), content: "<p></p>", stickies: [] });
      switchTab(newId);
      scheduleSync();
    }

    function deleteGroup(event, id) {
      event.stopPropagation();
      if (!confirm("Delete this group and its contents?")) return;
      state.groups = state.groups.filter(g => g.id !== id);
      if (state.activeId === id) state.activeId = state.groups[0].id;
      renderTabs();
      renderWorkspace();
      scheduleSync();
    }

    function formatDoc(cmd, val = null) {
      document.execCommand(cmd, false, val);
      editor.focus();
      scheduleSync();
    }

    function insertTable() {
      const r = prompt("Rows:", "3");
      const c = prompt("Columns:", "3");
      if (!r || !c) return;
      let html = "<table>";
      for (let i = 0; i < parseInt(r); i++) {
        html += "<tr>";
        for (let j = 0; j < parseInt(c); j++) html += "<td>&nbsp;</td>";
        html += "</tr>";
      }
      html += "</table><p></p>";
      formatDoc('insertHTML', html);
    }

    function insertImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        formatDoc('insertHTML', `<img src="${evt.target.result}" /><p></p>`);
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    }

    function createSticky() {
      addStickyNode(60, 60, "New note...");
      scheduleSync();
    }

    function addStickyNode(x, y, content) {
      const el = document.createElement('div');
      el.className = 'sticky-note';
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.innerHTML = `
        <div class="sticky-header">
          <span>Sticky</span>
          <span class="sticky-close">×</span>
        </div>
        <div class="sticky-content" contenteditable="true">${content}</div>
      `;

      el.querySelector('.sticky-close').onclick = () => { el.remove(); scheduleSync(); };
      el.querySelector('.sticky-content').oninput = scheduleSync;

      const header = el.querySelector('.sticky-header');
      let isDragging = false, startX, startY, origX, origY;

      header.onmousedown = (e) => {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        origX = el.offsetLeft;
        origY = el.offsetTop;
        document.onmousemove = (me) => {
          if (!isDragging) return;
          el.style.left = `${origX + (me.clientX - startX)}px`;
          el.style.top = `${origY + (me.clientY - startY)}px`;
        };
        document.onmouseup = () => {
          isDragging = false;
          document.onmousemove = null;
          document.onmouseup = null;
          scheduleSync();
        };
      };

      stickyContainer.appendChild(el);
    }

    function exportData() {
      saveLocalState();
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `notes_backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const loaded = JSON.parse(evt.target.result);
          if (loaded.groups && Array.isArray(loaded.groups)) {
            state = loaded;
            localStorage.setItem('notes_app_data', JSON.stringify(state));
            renderTabs();
            renderWorkspace();
            scheduleSync();
          }
        } catch (err) {
          alert("Invalid file format.");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    }

    editor.addEventListener('input', scheduleSync);
    renderTabs();
    renderWorkspace();
  </script>
</body>
</html>
